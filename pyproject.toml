[project]
name = "spendsight"
version = "0.1.0"
description = "Local-first spending insights for Chase checking and credit card exports."
readme = "SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5",
    "pandas>=3.0",
    "plotly>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spendsight"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
